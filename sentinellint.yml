# SentinelLint CI
#
# The analyzer itself makes no network calls. GitHub Actions of course needs
# network access for checkout/actions and for optional SARIF upload.

name: SentinelLint

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SentinelLint
        run: python run.py . --format sarif --output sentinellint.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sentinellint.sarif

      - name: Fail the build on HIGH or CRITICAL findings
        run: python run.py . --fail-on HIGH --no-color
